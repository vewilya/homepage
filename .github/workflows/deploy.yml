# Builds the site as static HTML and publishes it to GitHub Pages
# on every push to master. In the repository settings under Pages,
# the source must be "GitHub Actions" (the configure-pages step
# below switches it on the first run if it can).
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit hashes (the version tag is the comment),
      # so a moved or hijacked tag cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # --ignore-scripts skips the local "prepare" hook (vp config), which
      # only sets up git hooks and is not needed on the build server.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      # base_path is "/homepage" for a project page and empty once the custom
      # domain (public/CNAME) is active, so the base URL below works for both.
      - name: Build static site
        run: pnpm exec nuxt build --preset github_pages
        env:
          NUXT_APP_BASE_URL: ${{ steps.pages.outputs.base_path }}/
          NUXT_TELEMETRY_DISABLED: 1

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
